<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接内容中台</title><style>body{font:15px system-ui;background:#f3f6fa;color:#253651;display:grid;place-items:center;min-height:90vh}form{background:white;padding:36px;border:1px solid #dce4ef;border-radius:16px;width:360px}label{display:grid;gap:10px}input,button{font:inherit;padding:12px;border:1px solid #d4ddeb;border-radius:8px}button{margin-top:20px;background:#315fba;color:white;cursor:pointer}p{line-height:1.8;color:#6f7d91}</style><form id="connect"><h2>连接原系统</h2><p>只需首次设置主机地址，之后使用原系统登录和操作页面。</p><label>主机地址<input id="origin" type="url" placeholder="http://192.168.1.165:3000" required></label><button>打开系统</button><p id="error"></p></form><script>document.getElementById('connect').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/employee-api/config',{method:'POST',headers:{'content-type':'application/json','x-local-token':'__TOKEN__'},body:JSON.stringify({origin:document.getElementById('origin').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.reload();}catch(e){document.getElementById('error').textContent=e.message;}};</script></html>
